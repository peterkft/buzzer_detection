[flake8]
ignore = E203
max-line-length=120
max-doc-length=120
statistics = True
tee = True
max-complexity = 15
doctests = True
exclude=.venv,venv,output,test_script

[mypy]
; ignore_missing_imports could be set to False in the future when mypy is aware of more third-party packages.
ignore_missing_imports = True
cache_dir = output/mypy/.mypy_cache

[pylint.FORMAT]
# Maximum number of characters on a single line.
max-line-length=120

[pylint.BASIC]
# Include a hint for the correct naming format with invalid-name.
include-naming-hint=yes

[pylint.REPORTS]
# Template used to display messages. This is a python new-style format string
# used to format the message information. See doc for all details.
msg-template='{msg_id} {abspath}:{line}: {symbol}: {msg}'

# Set the output format. Available formats are: text, parseable, colorized,
# json2 (improved json format), json (old json format) and msvs (visual
# studio). You can also give a reporter class, e.g.
# mypackage.mymodule.MyReporterClass.
output-format=colorized

[pylint.MESSAGES CONTROL]
# Disable the message, report, category or checker with the given id(s). You
# can either give multiple identifiers separated by comma (,) or put this
# option multiple times (only on the command line, not in the configuration
# file where it should appear only once). You can also use "--disable=all" to
# disable everything first and then re-enable specific checks. For example, if
# you want to run only the similarities checker, you can use "--disable=all
# --enable=similarities". If you want to run only the classes checker, but have
# no Warning level messages displayed, use "--disable=all --enable=classes
# --disable=W".
disable=raw-checker-failed,
        bad-inline-option,
        locally-disabled,
        file-ignored,
        suppressed-message,
        useless-suppression,
        deprecated-pragma,
        use-implicit-booleaness-not-comparison-to-string,
        use-implicit-booleaness-not-comparison-to-zero,
        use-symbolic-message-instead,
        C0411, # wrong-import-order
        W1203, # logging-format-interpolation
        R1702  # too many nested blocks.